<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanzeeli</title>
<meta name="description" content="Tanzeeli — daily finite deals across Oman. App prototype.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tanzeeli">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;700&amp;family=Changa:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
h1,h2,h3,h4,p,ul{margin:0}
img{display:block}
input{font:inherit;border-radius:0}
[hidden]{display:none!important}
input::placeholder,textarea::placeholder{color:rgba(10,10,10,.6);opacity:1}
input:focus::placeholder,textarea:focus::placeholder{color:transparent}
@keyframes tz-band{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tz-band{animation:tz-band 22s linear infinite}
@keyframes tz-wig{0%{transform:rotate(0)}9.4%{transform:rotate(-16deg)}20.6%{transform:rotate(9deg)}30%{transform:rotate(-3deg)}37.5%,100%{transform:rotate(0)}}
.tz-tg{transform-box:view-box;transform-origin:101px 36px;animation:tz-wig 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.tz-band,.tz-tg{animation:none}}
.tz-switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;margin:0;border:2px solid #0A0A0A;background:#fff;position:relative;flex:none;cursor:pointer}
.tz-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#0A0A0A;transition:left .15s}
.tz-switch:checked{background:#FF0000}
.tz-switch:checked::after{left:20px;background:#fff}
.tz-acc summary{list-style:none;cursor:pointer}
.tz-acc summary::-webkit-details-marker{display:none}
.tz-acc[open] .tz-plus{transform:rotate(45deg)}

#tz-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#FF0000;transition:opacity .3s ease}
#tz-splash.out{opacity:0;pointer-events:none}
@keyframes tz-wig{0%{transform:rotate(0)}9.4%{transform:rotate(-16deg)}20.6%{transform:rotate(9deg)}30%{transform:rotate(-3deg)}37.5%,100%{transform:rotate(0)}}
.tz-tg{transform-box:view-box;transform-origin:101px 36px;animation:tz-wig 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.tz-tg{animation:none}}
html,body{height:100%;background:#E8E8E8;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;background:#fff;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr{width:390px;zoom:var(--z,1);height:calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / var(--z,1))}
.scr[hidden]{display:none}
.tz-screen{width:390px;height:100%}
.tz-screen main{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* on short screens content scrolls instead of squeezing: nothing inside the scroll area shrinks below its content */
.tz-screen main > *{flex-shrink:0}
.tz-screen main [style*="min-height: 0"]{min-height:auto!important}
@media (min-width:600px){
  #app{background:#E8E8E8;align-items:center;padding:24px}
  .scr{height:min(844px,calc(100dvh - 48px));border:2px solid #0A0A0A;box-shadow:12px 12px 0 #0A0A0A;overflow:hidden;background:#fff}
}
</style>
</head>
<body>
<div id="app"></div>
<noscript>This prototype needs JavaScript.</noscript>
<script>window.TZ_VERSION = '8e590ae727d5';

function tzInit(){
  var start = Date.now();
  var LIMIT_FREE = 100; // free delivery in Muscat from OMR 100, as on the website
  function pad(n){return (n<10?'0':'')+n}
  function $(sel, root){return (root||document).querySelector(sel)}
  function $$(sel, root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}
  function omr(n){return 'OMR ' + n.toFixed(3)}

  // ---------- state (kept on this phone between visits)
  var S = {saved: ['hph','tab'], cart: {mac:1, snk:1}};
  try { var raw = localStorage.getItem('tz-state'); if (raw) { var o = JSON.parse(raw); if (o && o.saved && o.cart) S = o; } } catch(e) {}
  function save(){ try { localStorage.setItem('tz-state', JSON.stringify(S)); } catch(e) {} }

  // ---------- timers
  function remaining(base){ var e = Math.floor((Date.now()-start)/1000); return base - (e % base); }
  function tick(){
    var els = $$('.scr:not([hidden]) [data-t]');
    for (var i=0;i<els.length;i++){
      var r = remaining(+els[i].getAttribute('data-t')), p = els[i].getAttribute('data-p');
      var h = pad(Math.floor(r/3600)), m = pad(Math.floor(r%3600/60)), s = pad(r%60);
      els[i].textContent = p==='h'?h:p==='m'?m:p==='s'?s:h+':'+m+':'+s;
    }
  }

  // ---------- saved deals
  function renderSaved(){
    $$('[data-heart]').forEach(function(b){
      var k = b.getAttribute('data-heart'), on = S.saved.indexOf(k) >= 0;
      var title = (b.getAttribute('aria-label')||'').replace(/^(Save|Remove) /,'').replace(/ from saved$/,'');
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', (on?'Remove ':'Save ') + title + (on?' from saved':''));
      var box = b.querySelector('span'), svg = b.querySelector('svg');
      if (box) box.style.color = on ? '#FF0000' : '#0A0A0A';
      if (svg) svg.setAttribute('fill', on ? 'currentColor' : 'none');
    });
    var grid = $('[data-saved-grid]');
    if (grid) {
      $$('[data-deal]', grid).forEach(function(c){ c.hidden = S.saved.indexOf(c.getAttribute('data-deal')) < 0; });
      // newest saved first
      S.saved.slice().reverse().forEach(function(k){ var c = $('[data-deal="'+k+'"]', grid); if (c) grid.appendChild(c); });
    }
    var n = S.saved.length;
    $$('[data-saved-empty]').forEach(function(e){ e.hidden = n > 0; });
    $$('[data-saved-grid]').forEach(function(e){ e.hidden = n === 0; });
    $$('[data-saved-count]').forEach(function(e){ e.textContent = n + (n === 1 ? ' deal' : ' deals'); });
    $$('[data-saved-n]').forEach(function(e){ e.textContent = n; });
    $$('[data-saved-badge]').forEach(function(e){ e.textContent = n; e.hidden = n === 0; });
  }

  // ---------- cart
  function renderCart(){
    var sub = 0, list = 0, count = 0;
    $$('[data-line]').forEach(function(l){
      var k = l.getAttribute('data-line'), q = S.cart[k] || 0, mx = +l.getAttribute('data-max');
      l.hidden = q === 0; if (!q) return;
      var unit = +l.getAttribute('data-unit'), mrp = +l.getAttribute('data-mrp');
      sub += unit*q; list += mrp*q; count += q;
      $('[data-qty]', l).textContent = q;
      $('[data-line-total]', l).textContent = omr(unit*q);
      var minus = $('[data-step="-1"]', l), plus = $('[data-step="1"]', l);
      minus.style.color = q <= 1 ? '#767676' : '#0A0A0A'; minus.setAttribute('aria-disabled', q <= 1);
      plus.style.color = q >= mx ? '#767676' : '#0A0A0A'; plus.setAttribute('aria-disabled', q >= mx);
    });
    var set = function(k, v){ $$('[data-sum="'+k+'"]').forEach(function(e){ e.textContent = v; }); };
    set('sub', omr(sub)); set('save', '− ' + omr(list - sub)); set('total', omr(sub));
    set('ship', sub >= LIMIT_FREE ? 'Free' : 'At checkout');
    $$('[data-ship-msg]').forEach(function(e){ e.textContent = sub >= LIMIT_FREE ? 'Free delivery in Muscat unlocked.' : omr(LIMIT_FREE - sub) + ' more for free delivery in Muscat.'; });
    $$('[data-cart-count]').forEach(function(e){ e.textContent = count + (count === 1 ? ' item' : ' items'); });
    $$('[data-cart-badge]').forEach(function(e){ e.textContent = count; e.hidden = count === 0; });
    $$('[data-cart-full]').forEach(function(e){ e.hidden = count === 0; });
    $$('[data-cart-empty]').forEach(function(e){ e.hidden = count > 0; });
    $$('[data-line-note]').forEach(function(e){ e.hidden = !S.cart[e.getAttribute('data-line-note')]; });
  }

  // ---------- drops: category chips, status filter, sort
  var F = {cat: 'all', sort: 'ends', status: {live: true, upcoming: true, sold: true}};
  var SORTS = [['ends','Ending soonest'], ['cut','Biggest discount'], ['price','Lowest price']];
  function renderDrops(){
    var box = $('[data-rows]'); if (!box) return;
    var rows = $$('article[data-deal]', box), shown = 0;
    rows.sort(function(a, b){
      if (F.sort === 'cut') return (+b.dataset.cutpct) - (+a.dataset.cutpct);
      if (F.sort === 'price') return (+a.dataset.price) - (+b.dataset.price);
      return (+a.dataset.ends) - (+b.dataset.ends);
    });
    var empty = $('[data-rows-empty]', box);
    rows.forEach(function(r){
      var ok = (F.cat === 'all' || r.dataset.cat === F.cat) && F.status[r.dataset.state];
      r.hidden = !ok; if (ok) shown++;
      box.insertBefore(r, empty);
    });
    empty.hidden = shown > 0;
    $$('[data-filter]').forEach(function(c){
      var on = c.getAttribute('data-filter') === F.cat; c.setAttribute('aria-pressed', on);
      c.style.background = on ? '#0A0A0A' : '#fff'; c.style.color = on ? '#fff' : '#0A0A0A';
    });
    var lab = $('[data-sort-label]'); if (lab) SORTS.forEach(function(s){ if (s[0] === F.sort) lab.textContent = s[1]; });
    $$('[data-status-filter]').forEach(function(c){ c.checked = !!F.status[c.getAttribute('data-status-filter')]; });
  }

  // ---------- calendar: the next drop opening (the tablet)
  function calTimes(){
    var t = $('#s-notify [data-t]'); var base = t ? +t.getAttribute('data-t') : 18729;
    var s0 = new Date(Date.now() + remaining(base)*1000); s0.setSeconds(0, 0);
    var s1 = new Date(s0.getTime() + 15*60000);
    var f = function(d){ return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); };
    return {a: f(s0), b: f(s1)};
  }
  var CAL_TITLE = 'Tanzeeli drop opens: Tablet 10.9"', CAL_TEXT = '16 units at OMR 74.000. One deal, one chance: claim before they are gone.';
  function addIcs(){
    var t = calTimes();
    var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tanzeeli//Drop//EN','BEGIN:VEVENT','UID:' + t.a + '-tablet@tanzeeli.app',
      'DTSTAMP:' + calTimes().a, 'DTSTART:' + t.a, 'DTEND:' + t.b, 'SUMMARY:' + CAL_TITLE, 'DESCRIPTION:' + CAL_TEXT, 'URL:' + location.origin + '/#/notify',
      'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:' + CAL_TITLE,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    var url = URL.createObjectURL(new Blob([ics], {type: 'text/calendar;charset=utf-8'}));
    var a = document.createElement('a'); a.href = url; a.download = 'tanzeeli-drop.ics'; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  function addGoogle(){
    var t = calTimes();
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(CAL_TITLE) + '&dates=' + t.a + '/' + t.b + '&details=' + encodeURIComponent(CAL_TEXT + ' ' + location.origin + '/#/notify'), '_blank');
  }

  // ---------- screens
  function fit(){ var w = window.innerWidth; document.documentElement.style.setProperty('--z', w < 600 ? Math.min(w, 480)/390 : 1); }
  function show(){
    var r = (location.hash.replace(/^#\/?/, '') || 'intro');
    var el = document.getElementById('s-'+r) || document.getElementById('s-intro');
    var cur = $('.scr:not([hidden])'); if (cur && cur !== el) cur.hidden = true;
    el.hidden = false;
    $$('main', el).forEach(function(m){ m.scrollTop = 0; });
    document.title = 'Tanzeeli — ' + el.getAttribute('aria-label');
    tick();
  }

  // ---------- taps
  document.addEventListener('click', function(ev){
    var t = ev.target, a, b;
    if ((a = t.closest('a[data-claim]'))) { var k = a.getAttribute('data-claim'); if (!S.cart[k]) S.cart[k] = 1; save(); renderCart(); return; }
    if ((a = t.closest('a[data-noop]'))) { ev.preventDefault(); return; }
    b = t.closest('button'); if (!b) return;
    if (b.type === 'submit') { ev.preventDefault(); return; }
    if (b.hasAttribute('data-heart')) { var h = b.getAttribute('data-heart'), i = S.saved.indexOf(h); if (i >= 0) S.saved.splice(i, 1); else S.saved.push(h); save(); renderSaved(); return; }
    var line = b.closest('[data-line]');
    if (line && b.hasAttribute('data-step')) { var key = line.getAttribute('data-line'), mx = +line.getAttribute('data-max'); S.cart[key] = Math.max(1, Math.min(mx, (S.cart[key]||1) + (+b.getAttribute('data-step')))); save(); renderCart(); return; }
    if (line && b.hasAttribute('data-remove')) { delete S.cart[line.getAttribute('data-line')]; save(); renderCart(); return; }
    if (b.hasAttribute('data-filter')) { F.cat = b.getAttribute('data-filter'); renderDrops(); return; }
    if (b.hasAttribute('data-sort')) { var ix = 0; SORTS.forEach(function(s, n){ if (s[0] === F.sort) ix = n; }); F.sort = SORTS[(ix+1) % SORTS.length][0]; renderDrops(); return; }
    if (b.hasAttribute('data-filter-toggle')) { var p = $('[data-filter-panel]'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', !p.hidden); return; }
    if (b.hasAttribute('data-filter-reset')) { F.cat = 'all'; F.status = {live: true, upcoming: true, sold: true}; renderDrops(); return; }
    if (b.hasAttribute('data-cal-open')) { var sh = $('[data-cal-sheet]'); sh.hidden = !sh.hidden; b.setAttribute('aria-expanded', !sh.hidden); return; }
    if (b.getAttribute('data-cal') === 'ics') { addIcs(); return; }
    if (b.getAttribute('data-cal') === 'google') { addGoogle(); return; }
    if (b.hasAttribute('aria-pressed') && b.parentElement) { // one-of-a-group buttons, e.g. language
      $$(':scope > button[aria-pressed]', b.parentElement).forEach(function(x){
        var on = x === b; x.setAttribute('aria-pressed', on); x.style.background = on ? '#0A0A0A' : '#fff'; x.style.color = on ? '#fff' : '#0A0A0A';
      });
    }
  });
  document.addEventListener('change', function(ev){
    var c = ev.target.closest('[data-status-filter]'); if (c) { F.status[c.getAttribute('data-status-filter')] = c.checked; renderDrops(); }
  });
  document.addEventListener('submit', function(ev){ ev.preventDefault(); });
  window.addEventListener('hashchange', show);
  window.addEventListener('resize', fit);
  function checkUpdate(){
    fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.v || j.v === window.TZ_VERSION) return;
        var last = 0; try { last = +sessionStorage.getItem('tz-reloaded') || 0; } catch(e) {}
        if (Date.now() - last < 30000) return; // at most one automatic reload every 30 seconds
        try { sessionStorage.setItem('tz-reloaded', Date.now()); } catch(e) {}
        location.reload();
      }).catch(function(){});
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') checkUpdate(); });
  window.addEventListener('focus', checkUpdate);
  setInterval(checkUpdate, 60000);
  fit(); renderSaved(); renderCart(); renderDrops(); show(); setInterval(tick, 1000); checkUpdate();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
}

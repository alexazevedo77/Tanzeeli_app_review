<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border-radius:0;cursor:pointer}
h1,h2,h3,h4,p,ul{margin:0}
img{display:block}
input{font:inherit;border-radius:0}
@keyframes tz-band{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tz-band{animation:tz-band 22s linear infinite}
@media (prefers-reduced-motion:reduce){.tz-band{animation:none}}

html,body{height:100%;background:#E8E8E8;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch;background:#fff;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr{width:390px;zoom:var(--z,1);height:calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / var(--z,1))}
.scr[hidden]{display:none}
.tz-screen{width:390px;height:100%}
.tz-screen main{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:600px){
  #app{background:#E8E8E8;align-items:center;padding:24px}
  .scr{height:min(844px,calc(100dvh - 48px));border:2px solid #0A0A0A;box-shadow:12px 12px 0 #0A0A0A;overflow:hidden;background:#fff}
}
</style>

<script>
function tzInit(){
  var start = Date.now();
  function pad(n){return (n<10?'0':'')+n}
  function tick(){
    var e = Math.floor((Date.now()-start)/1000);
    var els = document.querySelectorAll('.scr:not([hidden]) [data-t]');
    for (var i=0;i<els.length;i++){
      var b = +els[i].getAttribute('data-t'), p = els[i].getAttribute('data-p');
      var r = b - (e % b), h = pad(Math.floor(r/3600)), m = pad(Math.floor(r%3600/60)), s = pad(r%60);
      els[i].textContent = p==='h'?h:p==='m'?m:p==='s'?s:h+':'+m+':'+s;
    }
  }
  function fit(){ // scale the 390px design to the phone's width
    var w = window.innerWidth;
    document.documentElement.style.setProperty('--z', w < 600 ? Math.min(w, 480)/390 : 1);
  }
  function show(){
    var r = (location.hash.replace(/^#\/?/, '') || 'intro');
    var el = document.getElementById('s-'+r) || document.getElementById('s-intro');
    var cur = document.querySelector('.scr:not([hidden])');
    if (cur && cur !== el) cur.hidden = true;
    el.hidden = false;
    var mains = el.querySelectorAll('main'); for (var i=0;i<mains.length;i++) mains[i].scrollTop = 0;
    document.title = 'Tanzeeli — ' + el.getAttribute('aria-label');
    tick();
  }
  document.addEventListener('click', function(ev){
    var a = ev.target.closest('a[data-noop]'); if (a) { ev.preventDefault(); return; }
    var b = ev.target.closest('button');
    if (!b || b.type === 'submit') { if (b) ev.preventDefault(); return; }
    var lab = b.getAttribute('aria-label') || '';
    if (/^(Save|Remove) /.test(lab)) { // save hearts toggle
      var on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', (on?'Remove ':'Save ') + lab.replace(/^(Save|Remove) (.*?)( from saved)?$/, '$2') + (on?' from saved':''));
      var box = b.querySelector('span'), svg = b.querySelector('svg');
      if (box) box.style.color = on ? '#FF0000' : '#0A0A0A'; if (svg) svg.setAttribute('fill', on ? 'currentColor' : 'none');
      return;
    }
    if (b.hasAttribute('aria-pressed') && b.parentElement) { // one-of-a-group buttons: language, filter chips
      var sib = b.parentElement.querySelectorAll(':scope > button[aria-pressed]');
      for (var i=0;i<sib.length;i++){
        var on2 = sib[i] === b; sib[i].setAttribute('aria-pressed', on2);
        sib[i].style.background = on2 ? '#0A0A0A' : '#fff'; sib[i].style.color = on2 ? '#fff' : '#0A0A0A';
      }
    }
  });
  document.addEventListener('submit', function(ev){ ev.preventDefault(); });
  window.addEventListener('hashchange', show);
  window.addEventListener('resize', fit);
  fit(); show(); setInterval(tick, 1000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
}
